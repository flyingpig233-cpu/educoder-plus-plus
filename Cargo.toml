[workspace]
members = ["crates/core", "crates/ui"]
default-members = ["crates/core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/flyingpig233-cpu/educoder-plus-plus"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
