[package]
name = "educoder-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
httpdate = "1"
md5 = "0.8"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "gzip"] }
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
tokio.workspace = true
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }
directories = "6"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[dev-dependencies]
wiremock = "0.6"
