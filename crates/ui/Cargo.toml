[package]
name = "educoder-ui"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
educoder-core = { path = "../core" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "unstable-winit-030"] }
include_dir = "0.7"
wry = "0.57"
# Wry uses newer OffsetDateTime methods not present in time 0.3.5.
time = "0.3.44"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

[build-dependencies]
slint-build = "1"
