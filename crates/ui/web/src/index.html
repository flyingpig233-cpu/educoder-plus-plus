<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="stylesheet" href="app.css">
  <title>题目工作区</title>
</head>
<body>
  <header class="workbar">
    <button id="back" aria-label="返回作业列表" title="返回作业列表"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></button>
    <span id="homework-title">题目工作区</span>
    <select id="games" aria-label="选择关卡"></select>
  </header>
  <div id="notice" role="status" hidden></div>
  <div id="error" role="alert" hidden></div>
  <main id="workspace">
    <section class="problem-pane">
      <div class="section-heading">题目描述 <span class="heading-actions"><button id="answers">查看答案</button><button id="refresh-task" class="refresh-button" aria-label="刷新题目"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.6-.9L20 9M4 15l2.3 2.9A7 7 0 0 0 17.9 17"/></svg></button></span></div>
      <article id="description" class="markdown"><p class="muted">选择作业后，在这里阅读题目。</p></article>
      <div id="enter-panel" hidden><p>此实训尚未创建个人实例。</p><button id="enter">进入实训</button></div>
    </section>
    <div id="splitter" role="separator" aria-label="调整题目和编辑器宽度" tabindex="0"></div>
    <section class="code-pane">
      <div class="editor-toolbar">
        <select id="files" aria-label="选择代码文件"></select>
        <span id="dirty" class="muted">已同步</span>
        <span id="sync-status" class="muted" role="status">自动同步</span>
        <button id="submit" class="primary">提交评测</button>
      </div>
      <div id="editor" aria-label="Monaco 代码编辑器"></div>
      <section class="results-pane">
        <nav class="result-tabs">
          <button data-tab="local" class="selected">本地测试</button>
          <button data-tab="remote">平台结果与测试集</button>
          <span id="operation-status" class="muted"></span>
        </nav>
        <div id="local-tab" class="tab-content">
          <div class="sample-toolbar"><select id="samples" aria-label="选择本地样例"></select><button id="add-sample">添加样例</button><button id="remove-sample">删除</button><button id="run" class="primary">编译并运行</button><button id="settings">编译环境设置</button></div>
          <div class="sample-inputs"><label>标准输入<textarea id="stdin" placeholder="可留空；数据通过 stdin 传入"></textarea></label><label>预期输出（可选）<textarea id="expected" placeholder="留空时仅运行并显示输出"></textarea></label></div>
          <div id="local-results" class="output" aria-live="polite"><span class="muted">使用本机编译器运行当前代码；运行时限 5 秒。</span></div>
        </div>
        <div id="remote-tab" class="tab-content" hidden><div class="sample-toolbar"><span id="remote-status">尚未获取评测结果</span><button id="refresh-result" class="refresh-button" aria-label="刷新结果"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.6-.9L20 9M4 15l2.3 2.9A7 7 0 0 0 17.9 17"/></svg></button></div><div id="compile-output"></div><div id="test-cases"></div></div>
      </section>
    </section>
  </main>
  <dialog id="answer-dialog" aria-labelledby="answer-title">
    <div class="answer-heading"><strong id="answer-title">题目答案</strong><button id="close-answer" aria-label="关闭答案">×</button></div>
    <p id="answer-status" role="status"></p>
    <p class="muted">来源：gitee.com/flyingpigcpu-233/educoder-answer。仓库答案为本地验证版本，平台隐藏测试结果以实际评测为准。</p>
    <div class="sample-toolbar"><select id="answer-files" aria-label="选择答案文件"></select><button id="reload-answer" class="refresh-button" aria-label="重新查找答案"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.6-.9L20 9M4 15l2.3 2.9A7 7 0 0 0 17.9 17"/></svg></button><button id="copy-answer">复制答案代码</button></div>
    <textarea id="answer-code" readonly aria-label="答案代码" spellcheck="false"></textarea>
    <p class="muted">完整程序只可导入同类型代码文件；头文件或填空题请选取答案片段后插入。导入覆盖目标文件，可用 Ctrl+Z 撤销；代码会后台同步，不会自动提交评测。</p>
    <div class="sample-toolbar"><label>导入目标<select id="answer-target" aria-label="答案导入目标"></select></label><button id="import-answer">覆盖目标文件</button><button id="insert-answer">插入所选片段</button></div>
  </dialog>
  <div id="ac-celebration" hidden aria-live="polite" role="status"><canvas id="confetti-canvas" aria-hidden="true"></canvas><div class="ac-toast"><strong>AC</strong><span>Accepted · 全部测试通过</span></div></div>
  <script type="module" src="app.js"></script>
</body>
</html>
